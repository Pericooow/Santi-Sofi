<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="600" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1733"/>
      <stop offset=".55" stop-color="#2a2f6b"/>
      <stop offset="1" stop-color="#6b4f9e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy="1" r=".7">
      <stop offset="0" stop-color="#f3b38a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f3b38a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23463a"/>
      <stop offset="1" stop-color="#132a22"/>
    </linearGradient>
    <linearGradient id="shoot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="hairHer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1b1f"/>
      <stop offset="1" stop-color="#140c0e"/>
    </linearGradient>
    <mask id="moonM"><rect x="190" y="40" width="70" height="70" fill="#fff"/><circle cx="237" cy="66" r="21" fill="#000"/></mask>
  </defs>

  <!-- cielo -->
  <rect width="300" height="400" fill="url(#sky)"/>
  <rect y="200" width="300" height="200" fill="url(#glow)"/>

  <!-- luna -->
  <g>
    <circle cx="226" cy="74" r="30" fill="#f6f0dc" opacity=".08"/>
    <circle cx="226" cy="74" r="24" fill="#f6f0dc" mask="url(#moonM)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- estrellas que titilan -->
  <g fill="#fff">
    <circle cx="30" cy="40" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="90" r="1.2"><animate attributeName="opacity" values=".3;1;.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="115" cy="35" r="1.8"><animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="110" r="1.1"><animate attributeName="opacity" values=".4;1;.4" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="28" r="1.3"><animate attributeName="opacity" values="1;.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="140" r="1.5"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="160" r="1.3"><animate attributeName="opacity" values="1;.4;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="180" r="1"><animate attributeName="opacity" values=".2;.9;.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="170" r="1.2"><animate attributeName="opacity" values="1;.3;1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="255" cy="215" r="1"><animate attributeName="opacity" values=".4;1;.4" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="230" r="1.1"><animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="135" cy="60" r="1"><animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/></circle>
  </g>
  <!-- estrellitas de cuatro puntas -->
  <g fill="#fff">
    <path d="M60 60 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></path>
    <path d="M250 30 l1.6 5 5 1.6 -5 1.6 -1.6 5 -1.6 -5 -5 -1.6 5 -1.6z"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></path>
    <path d="M170 140 l1.4 4.2 4.2 1.4 -4.2 1.4 -1.4 4.2 -1.4 -4.2 -4.2 -1.4 4.2 -1.4z"><animate attributeName="opacity" values=".3;1;.3" dur="3.9s" repeatCount="indefinite"/></path>
  </g>

  <!-- estrella fugaz -->
  <g opacity="0">
    <line x1="0" y1="0" x2="46" y2="16" stroke="url(#shoot)" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="46" cy="16" r="2.2" fill="#fff"/>
    <animateTransform attributeName="transform" type="translate" values="20 40; 200 105" keyTimes="0;1" dur="1.4s" begin="1.5s;shootEnd.end+4s" repeatCount="1" id="shootMove"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.75;1" dur="1.4s" begin="1.5s;shootEnd.end+4s" id="shootEnd"/>
  </g>

  <!-- ciudad a lo lejos -->
  <g fill="#3a3466" opacity=".9">
    <path d="M0 300 h18 v-14 h10 v-8 h12 v22 h14 v-30 h12 v30 h16 v-18 h10 v18 h22 v-24 h14 v24 h20 v-12 h12 v12 h18 v-28 h10 v28 h22 v-16 h12 v16 h20 v-22 h14 v22 h14 V320 H0z"/>
  </g>
  <g fill="#ffd27a">
    <rect x="58" y="279" width="2" height="2"><animate attributeName="opacity" values="1;.3;1" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="131" y="282" width="2" height="2"/>
    <rect x="186" y="287" width="2" height="2"><animate attributeName="opacity" values=".4;1;.4" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="237" y="278" width="2" height="2"/>
    <rect x="23" y="291" width="2" height="2"/>
    <rect x="272" y="285" width="2" height="2"><animate attributeName="opacity" values="1;.4;1" dur="3.2s" repeatCount="indefinite"/></rect>
  </g>

  <!-- loma -->
  <path d="M0 318 Q150 268 300 318 V400 H0z" fill="url(#hill)"/>
  <path d="M0 330 Q150 290 300 332 V400 H0z" fill="#183429" opacity=".7"/>
  <!-- pasto -->
  <g stroke="#2f5e4c" stroke-width="1.4" stroke-linecap="round" fill="none">
    <path d="M30 322 l-2 -8 M34 321 l1 -9 M62 311 l-2 -7 M66 311 l2 -8 M232 306 l-1 -8 M236 307 l2 -7 M268 315 l-2 -8 M272 316 l1 -7"/>
  </g>

  <!-- ===== ELLOS (de espaldas, sentados mirando el cielo) ===== -->
  <g transform="translate(0 2)">
    <!-- sombra -->
    <ellipse cx="150" cy="318" rx="62" ry="6" fill="#0c1d17" opacity=".6"/>

    <!-- ÉL (derecha): camiseta blanca, pelo castaño ondulado -->
    <path d="M150 316 C148 288 154 268 176 264 C198 268 206 288 204 316 Z" fill="#f2efe8"/>
    <path d="M152 316 C150 296 156 280 168 274" stroke="#d9d4ca" stroke-width="2" fill="none"/>
    <!-- cuello -->
    <rect x="171" y="252" width="11" height="14" rx="4" fill="#c58a66"/>
    <!-- cabeza -->
    <circle cx="176" cy="240" r="17" fill="#c58a66"/>
    <!-- orejas -->
    <ellipse cx="159.5" cy="242" rx="3" ry="4.5" fill="#b77b58"/>
    <ellipse cx="192.5" cy="242" rx="3" ry="4.5" fill="#b77b58"/>
    <!-- pelo (desde atrás, ondulado, cubre la cabeza) -->
    <path d="M159 245 C156 224 166 214 177 214 C189 214 198 224 194 245 C193 252 189 256 184 257 L169 257 C164 256 160 252 159 245 Z" fill="#4a2e1d"/>
    <path d="M163 228 q5 -6 10 -2 M175 221 q6 -5 11 0 M184 230 q5 -4 8 2 M164 240 q5 -4 9 0 M177 236 q5 -4 10 0 M168 250 q4 -3 8 0 M180 249 q4 -3 8 0" stroke="#6b4429" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- ELLA (izquierda): pelo negro largo, apoyada en su hombro -->
    <path d="M100 316 C99 292 106 274 126 271 C144 274 152 292 151 316 Z" fill="#262838"/>
    <!-- cabeza inclinada hacia él -->
    <g transform="rotate(14 132 252)">
      <rect x="127" y="258" width="10" height="12" rx="4" fill="#c99476"/>
      <circle cx="132" cy="246" r="15" fill="#c99476"/>
      <!-- pelo largo -->
      <path d="M116 246 C114 228 124 230 132 230 C142 230 150 232 148 248 C150 266 146 286 140 300 C134 304 124 304 118 300 C114 284 113 264 116 246 Z" fill="url(#hairHer)"/>
      <path d="M118 240 C118 228 128 228 132 229 C140 228 148 232 147 242 C142 236 136 234 132 234 C126 234 121 236 118 240 Z" fill="#2c1d21"/>
      <path d="M124 254 q-2 16 0 34 M134 252 q2 18 -1 38 M141 256 q1 14 -2 30" stroke="#38262b" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".8"/>
      <!-- gafas en la cabeza -->
      <path d="M120 233 q12 -7 25 0" stroke="#e7b84a" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".9"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" values="0 132 268; 1.5 132 268; 0 132 268" dur="5s" repeatCount="indefinite"/>
    </g>

    <!-- su brazo alrededor de ella -->
    <path d="M160 276 C146 278 132 282 116 290" stroke="#f2efe8" stroke-width="10" fill="none" stroke-linecap="round"/>
    <circle cx="114" cy="291" r="5.5" fill="#c58a66"/>
  </g>

  <!-- chispitas que suben -->
  <g fill="#c9d6ff">
    <circle cx="140" cy="230" r="1.6" opacity="0">
      <animate attributeName="cy" values="230;170" dur="4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="225" r="1.3" opacity="0">
      <animate attributeName="cy" values="225;160" dur="5s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="5s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="154" cy="215" r="1.1" opacity="0">
      <animate attributeName="cy" values="215;150" dur="4.6s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4.6s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
